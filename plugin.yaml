name: hermes-pokemon
version: "0.6.0"
manifest_version: 1
kind: standalone
requires_hermes: ">=0.21.5"
description: >-
  A cozy pixel-art Pokémon companion for Hermes Desktop. Choose and nickname
  Bulbasaur, Charmander, or Squirtle; share a garden, play fetch, offer a berry,
  and enjoy little welcome-back greetings and species-specific habits.
  Desktop UI only: no Python code, tools, model calls, or runtime network access.
author: sxuff
homepage: https://github.com/sxuff/hermes-pokemon
