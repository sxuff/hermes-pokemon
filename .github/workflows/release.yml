name: Release plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Check tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Release tag must match package.json version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: npm ci
      - run: npm run build
      - name: Verify catalog bundle matches its committed source
        run: git diff --exit-code -- desktop/plugin.js
      - run: npm test
      - run: npm run package
      - name: Check ZIP integrity
        run: python -c "import glob, zipfile; p = glob.glob('release/*.zip')[0]; z = zipfile.ZipFile(p); assert z.testzip() is None; assert len(z.namelist()) == 7; print('Verified', p)"
      - name: Publish versioned ZIP and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/hermes-pokemon-$VERSION.zip" \
            "release/hermes-pokemon-$VERSION.sha256" \
            --verify-tag --title "Hermes Pokémon $RELEASE_TAG" --notes-file docs/RELEASE.md
